[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deutschpath-unified-agent"
version = "0.1.1.dev0"
description = "Deutschpath Unified Agent local engineering beta."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "chromadb>=1.0,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "mcp==1.30.0",
  "pypdf>=5,<7",
  "python-dotenv>=1.0,<2.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "rapidocr==3.10.0",
  "sentence-transformers>=5.7,<6.0",
  "streamlit>=1.40,<2.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
